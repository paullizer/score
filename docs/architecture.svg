<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1608" viewBox="0 0 1800 1608" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">Score application architecture</title>
  <desc id="svg-description">The React browser application calls an Entra-protected Express API hosted on Azure App Service. The API reads and writes workspace-scoped Cosmos records and private Blob sources, snapshots, and results. Cosmos feature records are the durable work queue for four independent Container Apps Jobs: jobs, grades, resumes, and analyses. Each worker uses its own feature stores. Job, grade, and resume workers acquire and extract sources through bounded public fetching, local parsers, Azure Document Intelligence, and an isolated internal Chromium renderer. All four workers use Foundry model inference. Analyses require an explicit user action and use frozen analysis inputs. Browser Web Workers export reports. Standalone samples use fictional browser-local data and are not a cloud fallback. Shared AI Search and Foundry IQ contain only a separate nonsensitive guide, not private evidence. This diagram describes the repository, not verified deployment status.</desc>
